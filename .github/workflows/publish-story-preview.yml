name: Publish isolated Story Engine preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-story-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live farm
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - name: Checkout tested integration
        uses: actions/checkout@v4
        with:
          ref: story-engine-integration
          path: integration
      - name: Verify tested Ink bundle and preview sources
        run: |
          test -s integration/scene-rebuild/story-ink-bundle.js
          test -s integration/scene-rebuild/main.js
          test -s integration/scene-rebuild/index.html
          node --check integration/scene-rebuild/main.js
          node --check integration/scene-rebuild/story-ink-bundle.js
          grep -q 'story-ink-bundle.js' integration/scene-rebuild/index.html
      - name: Copy only preview files, leaving live game unchanged
        run: |
          mkdir -p live/story-preview
          cp integration/scene-rebuild/index.html live/story-preview/index.html
          cp integration/scene-rebuild/main.js live/story-preview/main.js
          cp integration/scene-rebuild/style.css live/story-preview/style.css
          cp integration/scene-rebuild/story-ink-bundle.js live/story-preview/story-ink-bundle.js
      - name: Publish preview directory
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: live
          commit_message: Publish isolated farm Story Engine Safari preview
          file_pattern: story-preview/
