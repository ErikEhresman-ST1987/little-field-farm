name: Story integration build
on:
  push:
    branches: [story-engine-integration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.cjs
      - run: npm run build:story
      - run: node --check scene-rebuild/story-ink-bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: farm-ink-browser-bundle
          path: |
            scene-rebuild/
            assets/farm-v2/
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Build Ink browser runtime
          file_pattern: scene-rebuild/story-ink-bundle.js
