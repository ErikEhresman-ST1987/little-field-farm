<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Farm v2 — Placement Calibration</title>
<style>*{box-sizing:border-box}body{margin:0;background:#14261a;color:#f5fff3;font:15px system-ui,sans-serif}header,footer{padding:12px;max-width:1200px;margin:auto}h1{font-size:1.2rem;margin:0 0 10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;background:#31583d;color:white;border:1px solid #9ab99e;border-radius:7px;padding:9px;min-height:44px}button:disabled{opacity:.5}main{max-width:1200px;margin:auto;padding:0 8px}.stage{position:relative;aspect-ratio:4/3;width:100%;touch-action:none;border:1px solid #a5c4a7;border-radius:8px;overflow:hidden}.stage canvas{width:100%;height:100%;display:block}#status{padding:10px 2px;min-height:48px}small{color:#d5dfd4}code{overflow-wrap:anywhere}#output{width:100%;height:150px;background:#07180b;color:#fff;margin-top:8px}</style></head>
<body><header><h1>Little Field Farm v2 — Placement Calibration</h1><div class="toolbar"><label for="region">Region</label><select id="region"></select><button id="mode">Edit: corners</button><button id="guides">All guides: On</button><button id="undo">Undo</button><button id="reset">Reset selected</button><button id="export">Prepare JSON</button><button id="copy">Copy JSON</button><button id="download">Download JSON</button></div><small>Tap a region to select it. Drag numbered corner handles to fit its artwork. Switch to anchor mode to drag its sprite ground position. This diagnostic does not change the repository or saved games.</small></header><main><div id="stage" class="stage"></div><div id="status" role="status">Loading…</div><textarea id="output" readonly placeholder="Exported JSON appears here; copy it for review." aria-label="Exported placement JSON"></textarea></main>
<script type="module">
import * as PIXI from 'https://cdn.jsdelivr.net/npm/pixi.js@8.14.3/dist/pixi.min.mjs';
const root='../background/',stage=document.querySelector('#stage'),status=document.querySelector('#status'),select=document.querySelector('#region'),modeBtn=document.querySelector('#mode'),guideBtn=document.querySelector('#guides'),out=document.querySelector('#output');
const app=new PIXI.Application();let data,original,world,overlay,scale=1,editMode='corners',allGuides=true,selected,history=[],active=null;
const copy=x=>JSON.parse(JSON.stringify(x));
 function exportText(){const exported=copy(data);exported.status='calibration_draft_requires_review';exported.notes.push('Edited using interactive calibration; exported values require review and real-device verification before adoption.');return JSON.stringify(exported,null,2)}
 function prepare(){out.value=exportText();return out.value}
try{
 await app.init({resizeTo:stage,background:'#173622',resolution:Math.min(devicePixelRatio||1,2),autoDensity:true,antialias:true});
 stage.appendChild(app.canvas);
 const [map,texture]=await Promise.all([fetch(root+'farm_placement_map.json').then(r=>{if(!r.ok)throw Error('Map HTTP '+r.status);return r.json()}),PIXI.Assets.load(root+'farm_background_lossless.webp')]);
 original=copy(map);data=copy(map);selected=Object.keys(data.regions)[0];
 world=new PIXI.Container();app.stage.addChild(world);
 const bg=new PIXI.Sprite(texture);bg.width=map.canonical.width;bg.height=map.canonical.height;world.addChild(bg);
 overlay=new PIXI.Container();world.addChild(overlay);
 for(const id of Object.keys(data.regions)){const o=document.createElement('option');o.value=id;o.textContent=id.replaceAll('_',' ');select.append(o)}select.value=selected;
 const screenPoint=e=>{const rect=app.canvas.getBoundingClientRect();return {x:(e.clientX-rect.left-world.x)/scale,y:(e.clientY-rect.top-world.y)/scale}};
 const dist=(a,b)=>Math.hypot(a.x-b[0],a.y-b[1]);
 const clamp=(v,max)=>Math.max(0,Math.min(max,Math.round(v)));
 function layout(){const sw=app.screen.width,sh=app.screen.height;scale=Math.min(sw/map.canonical.width,sh/map.canonical.height);world.scale.set(scale);world.position.set((sw-map.canonical.width*scale)/2,(sh-map.canonical.height*scale)/2)}
 function draw(){overlay.removeChildren().forEach(c=>c.destroy());for(const [id,r] of Object.entries(data.regions)){if(!allGuides&&id!==selected)continue;const chosen=id===selected,g=new PIXI.Graphics();g.poly(r.polygon.flat()).fill({color:chosen?0xffdc73:0x42d7b5,alpha:chosen?.16:.07}).stroke({color:chosen?0xffdc73:0x42d7b5,width:chosen?3:2,alpha:chosen?1:.75});overlay.addChild(g);
 if(chosen){r.polygon.forEach(([x,y],i)=>{const h=new PIXI.Graphics().circle(x,y,9/scale).fill(0xffef9a).stroke({color:0x16281a,width:2/scale});overlay.addChild(h)});const [x,y]=r.sprite_anchor??r.center;const a=new PIXI.Graphics().moveTo(x-14/scale,y).lineTo(x+14/scale,y).moveTo(x,y-14/scale).lineTo(x,y+14/scale).stroke({color:0xff5252,width:3/scale});overlay.addChild(a)}}
 status.textContent='Selected '+selected+' | '+editMode+' | anchor '+JSON.stringify(data.regions[selected].sprite_anchor??data.regions[selected].center)+' | drag to adjust; export when ready.'}
 function chooseAt(p){for(const [id,r] of Object.entries(data.regions)){if(new PIXI.Polygon(r.polygon.flat()).contains(p.x,p.y)){selected=id;select.value=id;draw();return true}}return false}
 stage.addEventListener('pointerdown',e=>{const p=screenPoint(e);if(p.x<0||p.y<0||p.x>map.canonical.width||p.y>map.canonical.height)return;const r=data.regions[selected];let handle=null;if(editMode==='corners'){let best=Infinity;r.polygon.forEach((xy,i)=>{const d=dist(p,xy);if(d<best){best=d;handle=i}});if(best>25/scale)handle=null}else{if(dist(p,r.sprite_anchor??r.center)<35/scale)handle='anchor'}if(handle===null){chooseAt(p);return}history.push(copy(data));active={id:selected,handle,pointer:e.pointerId};stage.setPointerCapture(e.pointerId);e.preventDefault()});
 stage.addEventListener('pointermove',e=>{if(!active||active.pointer!==e.pointerId)return;const p=screenPoint(e),r=data.regions[active.id],xy=[clamp(p.x,map.canonical.width),clamp(p.y,map.canonical.height)];if(active.handle==='anchor')r.sprite_anchor=xy;else r.polygon[active.handle]=xy;draw();e.preventDefault()});
 const end=e=>{if(active?.pointer===e.pointerId)active=null};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
 select.onchange=()=>{selected=select.value;draw()};modeBtn.onclick=()=>{editMode=editMode==='corners'?'anchor':'corners';modeBtn.textContent='Edit: '+editMode;draw()};guideBtn.onclick=()=>{allGuides=!allGuides;guideBtn.textContent='All guides: '+(allGuides?'On':'Off');draw()};
 document.querySelector('#undo').onclick=()=>{if(history.length){data=history.pop();draw()}};
 document.querySelector('#reset').onclick=()=>{history.push(copy(data));data.regions[selected]=copy(original.regions[selected]);draw()};
 document.querySelector('#export').onclick=()=>{prepare();status.textContent='JSON prepared. Tap Copy JSON or Download JSON; repository remains unchanged.'};
 document.querySelector('#copy').onclick=async()=>{const value=prepare();try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value)}else{out.focus();out.select();if(!document.execCommand('copy'))throw Error('Copy unavailable')}status.textContent='JSON copied to clipboard. Paste it into the development chat.'}catch(err){out.focus();out.select();status.textContent='Automatic copy was blocked. Text is selected below; choose Copy from the iPad selection menu.'}};
 document.querySelector('#download').onclick=()=>{const blob=new Blob([prepare()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='little-field-farm-placement-draft.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='JSON download requested. Check Files/Downloads on your iPad.'};
 layout();new ResizeObserver(()=>{layout();draw()}).observe(stage);draw();
}catch(e){console.error(e);status.textContent='Calibration failed to load: '+e.message}
</script></body></html>
