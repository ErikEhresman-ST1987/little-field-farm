<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Little Field Farm — Graphical Proof 1</title><style>
*{box-sizing:border-box}body{margin:0;background:#19221b;color:#fff;font:15px system-ui,sans-serif}header{padding:12px 16px;background:#243c2b;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}header strong{font-size:17px}small{color:#cbd7c7}main{display:flex;flex-direction:column;height:calc(100dvh - 74px);min-height:470px}#stage{flex:1;min-height:250px;position:relative;touch-action:none;overflow:hidden;background:#203629}canvas{width:100%;height:100%;display:block}#tip{position:absolute;top:10px;left:10px;padding:6px 10px;background:#17261ec9;border-radius:8px;pointer-events:none}#panel{padding:12px;background:#243c2b;display:flex;flex-wrap:wrap;gap:12px;align-items:center}button{border:1px solid #99bd9b;background:#f2f4e6;color:#213425;border-radius:9px;padding:10px 12px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#b9e4a8}label{display:flex;align-items:center;gap:7px}input[type=range]{width:130px}#status{color:#dbead7}a{color:#d6edc7}@media(max-width:600px){main{height:calc(100dvh - 104px)}#panel{gap:8px}button{padding:9px}#tip{font-size:12px}}
</style></head><body><header><div><strong>Little Field Farm · Graphical Proof 1</strong><div><small>Candidate transparency and real-size placement test — not production-approved</small></div></div><small>Drag to pan · Pinch or wheel to zoom</small></header><main><div id="stage"><canvas id="view"></canvas><div id="tip">Tap a plot to cycle its crop state</div></div><div id="panel"><button id="reset">Reset view</button><button id="cycle">Cycle all crops</button><label>Plot scale <input id="size" type="range" min="65" max="170" value="100"><output id="sizeValue">100%</output></label><label><input id="dark" type="checkbox"> Dark verification background</label><span id="status" role="status">Loading artwork…</span></div></main><script>
const names=['empty','growing','mature'];const paths=['carrot_empty.webp','carrot_growing.webp','carrot_mature.webp'];const assets={};const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');let scale=1,offsetX=0,offsetY=0,plotScale=1;const plots=[{x:650,y:470,s:0},{x:825,y:505,s:1},{x:1010,y:555,s:2}];const pointers=new Map();let gesture=null;let tapCandidate=null;
function load(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}
function resize(){const rect=stage.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!resize.initial){reset();resize.initial=true}else draw()}
function reset(){scale=Math.min(stage.clientWidth/1536,stage.clientHeight/1024);offsetX=(stage.clientWidth-1536*scale)/2;offsetY=(stage.clientHeight-1024*scale)/2;draw()}
function draw(){if(!assets.farm)return;const w=stage.clientWidth,h=stage.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle=document.querySelector('#dark').checked?'#303137':'#243c2b';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);if(!document.querySelector('#dark').checked)ctx.drawImage(assets.farm,0,0,1536,1024);for(const p of plots){const img=assets[names[p.s]];if(!img)continue;const side=175*plotScale;ctx.drawImage(img,p.x-side/2,p.y-side*.69,side,side)}ctx.restore()}
function scenePoint(x,y){return{x:(x-offsetX)/scale,y:(y-offsetY)/scale}}
function hit(x,y){const pt=scenePoint(x,y),side=175*plotScale;for(let i=plots.length-1;i>=0;i--){const p=plots[i];if(Math.abs(pt.x-p.x)<side*.45&&pt.y>p.y-side*.63&&pt.y<p.y+side*.28)return i}return -1}
function local(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=local(e);pointers.set(e.pointerId,p);if(pointers.size===1){gesture={x:p.x,y:p.y,ox:offsetX,oy:offsetY};tapCandidate={...p,moved:false}}else{tapCandidate=null;gesture=null}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=local(e),prev=pointers.get(e.pointerId);pointers.set(e.pointerId,p);if(pointers.size===1&&gesture){const dx=p.x-gesture.x,dy=p.y-gesture.y;if(Math.hypot(dx,dy)>7)tapCandidate.moved=true;offsetX=gesture.ox+dx;offsetY=gesture.oy+dy}else if(pointers.size===2){const arr=[...pointers.values()],other=[...pointers.entries()].find(([id])=>id!==e.pointerId)[1];const oldDist=Math.hypot(prev.x-other.x,prev.y-other.y),newDist=Math.hypot(p.x-other.x,p.y-other.y);if(oldDist>0){const mid={x:(p.x+other.x)/2,y:(p.y+other.y)/2};zoom(newDist/oldDist,mid.x,mid.y)}}draw()});
function end(e){if(!pointers.has(e.pointerId))return;const p=local(e);if(tapCandidate&&!tapCandidate.moved&&pointers.size===1){const i=hit(p.x,p.y);if(i>=0){plots[i].s=(plots[i].s+1)%3;document.querySelector('#status').textContent='Plot '+(i+1)+': '+names[plots[i].s]}}pointers.delete(e.pointerId);tapCandidate=null;gesture=null;if(pointers.size===1){const q=[...pointers.values()][0];gesture={x:q.x,y:q.y,ox:offsetX,oy:offsetY}}draw()}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
function zoom(f,x,y){const next=Math.max(.18,Math.min(3,scale*f));const ratio=next/scale;offsetX=x-(x-offsetX)*ratio;offsetY=y-(y-offsetY)*ratio;scale=next}
canvas.addEventListener('wheel',e=>{e.preventDefault();const p=local(e);zoom(Math.exp(-e.deltaY*.001),p.x,p.y);draw()},{passive:false});
document.querySelector('#reset').onclick=reset;document.querySelector('#cycle').onclick=()=>{plots.forEach(p=>p.s=(p.s+1)%3);draw()};document.querySelector('#dark').onchange=draw;document.querySelector('#size').oninput=e=>{plotScale=+e.target.value/100;document.querySelector('#sizeValue').textContent=e.target.value+'%';draw()};
Promise.all([load('farm_reference.webp'),...paths.map(load)]).then(([farm,...sprites])=>{assets.farm=farm;names.forEach((n,i)=>assets[n]=sprites[i]);document.querySelector('#status').textContent='Artwork loaded · tap plots to inspect';resize();new ResizeObserver(resize).observe(stage)}).catch(e=>document.querySelector('#status').textContent='Could not load assets: '+e.message);
</script></body></html>
